<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Social Presence Autopilot app icon. Colors are the app's own theme tokens
    (apps/web/src/app.css) so the icon and the UI read as one thing.
    A speech bubble drawn as an OS window: "social" + "OS", legible down to 16px
    because the silhouette carries it and the detail only has to survive 128px+.
  -->
  <rect x="120" y="120" width="784" height="784" rx="172" fill="#f3f1e7" stroke="#14140f" stroke-width="40"/>

  <!-- bubble / window. ponytail: one path, so the tail joins the body with no seam to hide. -->
  <path d="M298 270 H726 A48 48 0 0 1 774 318 V562 A48 48 0 0 1 726 610 H530 L350 762 L390 610 H298 A48 48 0 0 1 250 562 V318 A48 48 0 0 1 298 270 Z"
        fill="#39ff88" stroke="#14140f" stroke-width="34" stroke-linejoin="round"/>

  <!-- title bar -->
  <path d="M250 362 H774" stroke="#14140f" stroke-width="34"/>
  <circle cx="324" cy="316" r="24" fill="#14140f"/>
  <circle cx="408" cy="316" r="24" fill="#ffd23f" stroke="#14140f" stroke-width="12"/>
</svg>
